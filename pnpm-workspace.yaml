# Supply-chain quarantine: refuse any release younger than 24 h. pnpm 11+ applies
# it by default and checks the committed lockfile against it too, but pnpm 10
# leaves it OFF unless the key is present, so it stays explicit and the guard
# does not depend on which pnpm runs. Verified against a positive control: with
# the key armed pnpm refuses a two-day-old release with
# ERR_PNPM_NO_MATURE_MATCHING_VERSION, and without it the same install succeeds.
minimumReleaseAge: 1440

# Refuse to install under a Node outside `engines.node`. It lives here and not in
# .npmrc because pnpm 11+ reads only auth and registry settings from .npmrc: an
# `engine-strict=true` there is silently ignored. Measured 2026-10-03 on 10.33.0,
# 11.9.0 and 12.8.1: with this key all three refuse a too-new `engines.node` with
# ERR_PNPM_UNSUPPORTED_ENGINE; without it the same install succeeds.
engineStrict: true


allowBuilds:
  esbuild: false
overrides:
  # Security floors. Each entry pins a transitive chain that would otherwise
  # re-resolve back to a vulnerable version: the parent's own range still
  # admits one, so the safe version we get today is luck, not a decision.
  qs@>=6.11.1 <=6.15.1: ^6.15.2
  postcss@<8.5.23: ^8.5.23 # vitest > vite (asks ^8.5.6) — GHSA-fxqj-rqcc-2cmp
  nanoid@<3.3.18: ^3.3.18 # vite > postcss (asks ^3.3.16) — GHSA-2v37-7h3g-55p8
  body-parser@<2.3.0: ^2.3.0 # express (asks ^2.2.1) — GHSA-v422-hmwv-36x6
  path-to-regexp: '>=8.4.0'
  form-data@>=4.0.0 <4.0.6: ^4.0.6
  shell-quote@<1.11.0: ^1.11.0 # concurrently — GHSA-pqg4-j6r4-53mv
  proxy-addr@<2.0.8: ^2.0.8 # express (5.3.0 asks ^2.0.8; 5.2 admitted older) — GHSA-jqcg-44mw-7w3h
  source-map-js@<1.2.2: ^1.2.2 # vite > postcss — GHSA-68fv-2mgg-jv7q
# vite is not listed here on purpose. It arrives as vitest's own dependency
# (^6 || ^7 || ^8), and an override cannot move an already-locked version — a
# plain install left it behind while reporting an unmet peer. Declaring it a
# direct devDependency is what actually decides the version, so it lives in
# package.json alongside the rest of the test toolchain.
