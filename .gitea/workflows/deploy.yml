name: Deploy Backend (Gitea)

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "*.md"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  APP_SERVER: dtpf@10.5.0.165
  APP_SERVER_PORT: 22
  SERVICE_NAME: dtpf
  npm_config_registry: http://10.5.0.61:4873

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: "10.33.0"
          run_install: false

      - name: Verify pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build TypeScript
        run: pnpm build

      - name: Install production dependencies
        run: |
          mkdir -p .deploy
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml .deploy/
          cd .deploy
          pnpm install --prod --frozen-lockfile

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "target=production" >> $GITHUB_OUTPUT
            echo "pm2_name=dtpf" >> $GITHUB_OUTPUT
            echo "node_env=production" >> $GITHUB_OUTPUT
          else
            echo "target=staging" >> $GITHUB_OUTPUT
            echo "pm2_name=dtpf-staging" >> $GITHUB_OUTPUT
            echo "node_env=staging" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to app server
        env:
          TARGET: ${{ steps.env.outputs.target }}
          PM2_NAME: ${{ steps.env.outputs.pm2_name }}
          NODE_ENV_VAL: ${{ steps.env.outputs.node_env }}
        run: |
          DEPLOY_DIR="/html/$SERVICE_NAME/$TARGET"
          RSYNC_SSH="ssh -o StrictHostKeyChecking=no -p $APP_SERVER_PORT"
          SSH_CMD="ssh -o StrictHostKeyChecking=no -p $APP_SERVER_PORT $APP_SERVER"

          rsync -az --delete --exclude='*.map' -e "$RSYNC_SSH" dist/ $APP_SERVER:$DEPLOY_DIR/src/
          rsync -az --delete -e "$RSYNC_SSH" .deploy/node_modules/ $APP_SERVER:$DEPLOY_DIR/node_modules/
          rsync -az -e "$RSYNC_SSH" --include='package.json' --include='pnpm-lock.yaml' --exclude='*' ./ $APP_SERVER:$DEPLOY_DIR/

          $SSH_CMD "
            export NVM_DIR=\$HOME/.nvm && [ -s \$NVM_DIR/nvm.sh ] && . \$NVM_DIR/nvm.sh
            for attempt in 1 2 3; do
              NODE_ENV=$NODE_ENV_VAL pm2 reload $PM2_NAME --update-env && break
              echo \"PM2 reload attempt \$attempt/3 failed, retrying in 15s...\"
              sleep 15
            done
          "
          echo "backend deployed to $TARGET"

      - name: Notify build failure
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then exit 0; fi
          REPO="${GITHUB_REPOSITORY#*/}"
          MSG="❌ **${REPO}** Gitea deploy FAILED (${{ github.ref_name }})"
          TXN="ci-$(date +%s%N)"
          curl -sf -X PUT \
            "https://matrixdm.dtpf.es/_matrix/client/v3/rooms/%21UdPuWAOSDiENZBGANx:matrixdm/send/m.room.message/$TXN" \
            -H 'Authorization: Bearer ${{ secrets.CI_BUILDS_BOT_TOKEN }}' \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg msg "$MSG" '{msgtype:"m.text",body:$msg}')" \
            || echo "::warning::Element notification failed"
