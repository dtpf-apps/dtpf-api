name: Deploy Backend

on:
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_SERVER: dtpf@10.5.0.165
  APP_SERVER_PORT: 22
  SERVICE_NAME: dtpf

jobs:
  deploy:
    runs-on: [self-hosted, light]
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build TypeScript
        run: pnpm build

      - name: Install production dependencies
        run: |
          mkdir -p .deploy
          cp package.json pnpm-lock.yaml .deploy/
          cd .deploy
          pnpm install --prod --frozen-lockfile

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "target=production" >> $GITHUB_OUTPUT
          else
            echo "target=staging" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to server
        run: |
          TARGET="${{ steps.env.outputs.target }}"
          DEPLOY_DIR="/html/${{ env.SERVICE_NAME }}/$TARGET"
          SSH_CMD="ssh -o StrictHostKeyChecking=no -p ${{ env.APP_SERVER_PORT }} ${{ env.APP_SERVER }}"
          RSYNC_SSH="ssh -o StrictHostKeyChecking=no -p ${{ env.APP_SERVER_PORT }}"

          # Send compiled artifacts
          rsync -az --delete --exclude='*.map' \
            -e "$RSYNC_SSH" \
            dist/ ${{ env.APP_SERVER }}:$DEPLOY_DIR/src/

          # Send production node_modules
          rsync -az --delete \
            -e "$RSYNC_SSH" \
            .deploy/node_modules/ ${{ env.APP_SERVER }}:$DEPLOY_DIR/node_modules/

          # Send config files
          rsync -az \
            -e "$RSYNC_SSH" \
            --include='package.json' \
            --include='pnpm-lock.yaml' \
            --exclude='*' \
            ./ ${{ env.APP_SERVER }}:$DEPLOY_DIR/

          # Restart process
          if [ "$TARGET" = "staging" ]; then
            PM2_NAME="dtpf-staging"
            NODE_ENV_VAL="staging"
          else
            PM2_NAME="dtpf"
            NODE_ENV_VAL="production"
          fi
          $SSH_CMD "
            export NVM_DIR=\$HOME/.nvm && [ -s \$NVM_DIR/nvm.sh ] && . \$NVM_DIR/nvm.sh
            NODE_ENV=$NODE_ENV_VAL pm2 reload $PM2_NAME --update-env
          "

          echo "✓ Backend deployed to $TARGET"

      - name: Auto-rerun on infra failure
        id: autorerun
        if: failure() && github.run_attempt == 1
        env:
          GH_TOKEN: ${{ secrets.RERUN_TOKEN }}
        run: |
          LOGS=$(gh run view ${{ github.run_id }} --log-failed --repo ${{ github.repository }} 2>/dev/null || true)
          if echo "$LOGS" | grep -qE "Killed|exit code 137|exit 137|timed out in [0-9]+ms|Hook timed out"; then
            REASON=$(echo "$LOGS" | grep -oE "Killed|exit code 137|exit 137|timed out in [0-9]+ms|Hook timed out" | head -1)
            echo "::warning::Detected infra failure ($REASON), triggering auto-rerun"
            echo "triggered=true" >> $GITHUB_OUTPUT
            gh run rerun ${{ github.run_id }} --failed --repo ${{ github.repository }}
          else
            echo "Failure does not look like infra (no OOM/timeout match) — not rerunning"
            echo "triggered=false" >> $GITHUB_OUTPUT
          fi

      - name: Notify build failure
        if: failure() && steps.autorerun.outputs.triggered != 'true'
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          MSG="❌ **${REPO}** deploy FAILED (${{ github.ref_name }})"
          TXN="ci-$(date +%s%N)"
          curl -sf -X PUT \
            "https://matrixdm.dtpf.es/_matrix/client/v3/rooms/%21UdPuWAOSDiENZBGANx:matrixdm/send/m.room.message/$TXN" \
            -H 'Authorization: Bearer ${{ secrets.CI_BUILDS_BOT_TOKEN }}' \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg msg "$MSG" '{msgtype:"m.text",body:$msg}')" \
            || echo "::warning::Element notification failed"

