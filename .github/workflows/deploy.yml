name: Deploy Backend

on:
  push:
    branches: [main, dev]

env:
  APP_SERVER: dtpf@10.5.0.165
  APP_SERVER_PORT: 22
  SERVICE_NAME: dtpf

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript
        run: pnpm build

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "target=production" >> $GITHUB_OUTPUT
          else
            echo "target=staging" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to server
        run: |
          TARGET="${{ steps.env.outputs.target }}"
          DEPLOY_DIR="/html/${{ env.SERVICE_NAME }}/$TARGET"
          SSH_CMD="ssh -o StrictHostKeyChecking=no -p ${{ env.APP_SERVER_PORT }} ${{ env.APP_SERVER }}"

          # Rotate src → src_old on server
          $SSH_CMD "
            if [ -d $DEPLOY_DIR/src_old ]; then rm -rf $DEPLOY_DIR/src_old; fi
            if [ -d $DEPLOY_DIR/src ]; then mv $DEPLOY_DIR/src $DEPLOY_DIR/src_old; fi
          "

          # Send compiled artifacts
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no -p ${{ env.APP_SERVER_PORT }}" \
            dist/ ${{ env.APP_SERVER }}:$DEPLOY_DIR/src/

          # Send config files
          rsync -az \
            -e "ssh -o StrictHostKeyChecking=no -p ${{ env.APP_SERVER_PORT }}" \
            --include='package.json' \
            --include='pnpm-lock.yaml' \
            --exclude='*' \
            ./ ${{ env.APP_SERVER }}:$DEPLOY_DIR/

          # Install production deps + restart process
          if [ "$TARGET" = "staging" ]; then
            # Staging uses Forever
            $SSH_CMD "
              export NVM_DIR=\$HOME/.nvm
              [ -s \$NVM_DIR/nvm.sh ] && . \$NVM_DIR/nvm.sh
              cd $DEPLOY_DIR
              pnpm install --prod
              FOREVER_ROOT=\$HOME \$HOME/.nvm/versions/node/v22.22.0/bin/forever restart ${{ env.SERVICE_NAME }}-staging 2>/dev/null || true
            "
          else
            # Production uses PM2
            $SSH_CMD "
              export NVM_DIR=\$HOME/.nvm
              [ -s \$NVM_DIR/nvm.sh ] && . \$NVM_DIR/nvm.sh
              cd $DEPLOY_DIR
              pnpm install --prod
              NODE_ENV=production pm2 reload ${{ env.SERVICE_NAME }} --update-env 2>/dev/null || \
                NODE_ENV=production pm2 start $DEPLOY_DIR/src/index.js --name ${{ env.SERVICE_NAME }}
            "
          fi

          echo "✓ Backend deployed to $TARGET"
