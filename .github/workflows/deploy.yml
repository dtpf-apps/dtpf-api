name: Deploy Backend

on:
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_SERVER: dtpf@10.5.0.165
  APP_SERVER_PORT: 22
  SERVICE_NAME: dtpf

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build TypeScript
        run: pnpm build

      - name: Install production dependencies
        run: |
          mkdir -p .deploy
          cp package.json pnpm-lock.yaml .deploy/
          cd .deploy
          pnpm install --prod --frozen-lockfile

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "target=production" >> $GITHUB_OUTPUT
          else
            echo "target=staging" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to server
        run: |
          TARGET="${{ steps.env.outputs.target }}"
          DEPLOY_DIR="/html/${{ env.SERVICE_NAME }}/$TARGET"
          SSH_CMD="ssh -o StrictHostKeyChecking=no -p ${{ env.APP_SERVER_PORT }} ${{ env.APP_SERVER }}"
          RSYNC_SSH="ssh -o StrictHostKeyChecking=no -p ${{ env.APP_SERVER_PORT }}"

          # Send compiled artifacts
          rsync -az --delete --exclude='*.map' \
            -e "$RSYNC_SSH" \
            dist/ ${{ env.APP_SERVER }}:$DEPLOY_DIR/src/

          # Send production node_modules
          rsync -az --delete \
            -e "$RSYNC_SSH" \
            .deploy/node_modules/ ${{ env.APP_SERVER }}:$DEPLOY_DIR/node_modules/

          # Send config files
          rsync -az \
            -e "$RSYNC_SSH" \
            --include='package.json' \
            --include='pnpm-lock.yaml' \
            --exclude='*' \
            ./ ${{ env.APP_SERVER }}:$DEPLOY_DIR/

          # Restart process
          if [ "$TARGET" = "staging" ]; then
            PM2_NAME="dtpf-staging"
            NODE_ENV_VAL="staging"
          else
            PM2_NAME="dtpf"
            NODE_ENV_VAL="production"
          fi
          $SSH_CMD "
            export NVM_DIR=\$HOME/.nvm && [ -s \$NVM_DIR/nvm.sh ] && . \$NVM_DIR/nvm.sh
            NODE_ENV=$NODE_ENV_VAL pm2 reload $PM2_NAME --update-env
          "

          echo "✓ Backend deployed to $TARGET"

      - name: Notify build failure
        if: failure()
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          MSG="❌ **${REPO}** deploy FAILED (${{ github.ref_name }})"
          curl -sf http://10.5.0.47:18789/tools/invoke \
            -H 'Authorization: Bearer ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}' \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg msg "$MSG" '{
              tool: "message",
              action: "send",
              args: { message: $msg, to: "room:!UdPuWAOSDiENZBGANx:matrixdm", channel: "matrix" }
            }')" || echo "::warning::Element notification failed"

